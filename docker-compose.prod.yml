services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
    restart: unless-stopped
