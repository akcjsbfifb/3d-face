services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: pnpm --filter @portfolio/web dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./apps/web/package.json:/app/apps/web/package.json:ro
      - /app/apps/web/node_modules
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/api/package.json
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: pnpm --filter @portfolio/api dev
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
    volumes:
      - ./apps/api:/app/apps/api
      - ./package.json:/app/package.json:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - /app/apps/api/node_modules
      - /app/node_modules
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/api/package.json
    restart: unless-stopped
