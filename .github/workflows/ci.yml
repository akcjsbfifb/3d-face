name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    # Oracle Ampere (ARM64) self-hosted runner — persistent /nix/store
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          nix --version
          nix develop --command bash -lc 'node -v && pnpm -v'

      - name: Install, lint, build
        run: nix run .#ci
